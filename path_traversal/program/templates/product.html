<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ product.name }} - ShopDemo</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
  header { background: #222; color: white; padding: 20px; text-align: center; }
  .detail { display: flex; gap: 40px; max-width: 800px; margin: 40px auto; background: white;
            padding: 30px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  .detail img { width: 300px; border-radius: 6px; }
  .info h2 { margin-top: 0; }
  .price { font-size: 1.4em; color: #2980b9; font-weight: bold; }
  .back { display: inline-block; margin-top: 20px; color: #2980b9; text-decoration: none; }
  code { background: #eee; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <h1>ShopDemo</h1>
  </header>

  <div class="detail">
    <img src="/image?filename={{ product.image }}" alt="{{ product.name }}">
    <div class="info">
      <h2>{{ product.name }}</h2>
      <p class="price">{{ product.price }}</p>
      <p>{{ product.description }}</p>

      <a class="back" href="/">&larr; Back to home</a>
    </div>
  </div>
</body>
</html>
