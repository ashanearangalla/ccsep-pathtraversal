<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ShopDemo - Home</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
  header { background: #222; color: white; padding: 20px; text-align: center; }
  .grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; padding: 40px; }
  .card { background: white; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
          width: 220px; text-align: center; padding: 15px; }
  .card img { width: 100%; border-radius: 6px; }
  .card h3 { margin: 10px 0 5px; }
  .card p { color: #555; margin: 0 0 10px; }
  .card a { text-decoration: none; background: #2980b9; color: white; padding: 8px 14px;
            border-radius: 4px; font-size: 14px; }
</style>
</head>
<body>
  <header>
    <h1>ShopDemo</h1>
    <p>A minimal store used to demonstrate path traversal in the image endpoint.</p>
  </header>

  <div class="grid">
    {% for pid, p in products.items() %}
    <div class="card">
      <img src="/image?filename={{ p.image }}" alt="{{ p.name }}">
      <h3>{{ p.name }}</h3>
      <p>{{ p.price }}</p>
      <a href="/product?id={{ pid }}">View details</a>
    </div>
    {% endfor %}
  </div>
</body>
</html>
